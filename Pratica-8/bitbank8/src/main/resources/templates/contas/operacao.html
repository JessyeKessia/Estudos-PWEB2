<!doctype html>
<html lang="pt_BR" xmlns:th="www.thymeleaf.org">
<head>
    <title>BitBank - Cadastro de Operações</title>
    <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css}" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="icon" th:href="@{/imagens/favicon.ico}" type="image/x-icon" />
</head>
<body>
    <!-- Cabecalho comum -->
    <div th:insert="~{cabecalho}"></div>

    <div class="container mt-4">

    <div class="card">

        <div class="card-header">
            Cadastro de Operação
        </div>

        <div class="card-body">
            <!-- Mensagem de erro ou acerto -->
            <div th:if ="${not #strings.isEmpty(mensagem)}" th:text="${mensagem}" class="alert alert-success"></div>
            <!-- FORM: buscar conta -->
            <div th:if="${conta == null}">

                <form th:action="@{/contas/operacao}" method="POST">

                    <div class="mb-3">
                        <label for="nuConta" class="form-label">Número da conta</label>
                        <input type="text" id="nuConta" name="nuConta" class="form-control" placeholder="Digite o número da conta" />
                    </div>
                    <button type="submit" class="btn btn-primary"> Próximo</button>
                </form>

            </div>

             <!-- FORM: conta encontrada -->
            <div th:if="${conta != null}">

                <table class="table table-striped table-hover">
                    <tr>
                        <th>Conta</th>
                        <th>Correntista</th>
                        <th>Data de abertura</th>
                    </tr>
                    <tr>
                        <td th:text="${conta.numero}"></td>
                        <td th:text="${conta.correntista.nome}"></td>
                        <td th:text="${#temporals.format(conta.data, 'dd/MM/yyyy')}"></td>
                    </tr>
                </table>

                <h5 class="mb-3">Informações da transação</h5>

                <form action="operacao" method="POST" th:object="${transacao}">

                    <!--Escondidos-->
                    <input class="form-control" type="hidden" th:field="*{id}" />
                    <input class="form-control" type="hidden" th:value="${conta.numero}" name="nuConta" />

                    <label class="form-label">Descrição</label>
                    <input class="form-control" type="text" th:field="*{descricao}" />

                    <label class="form-label">Data</label>
                    <input type="text" class="form-control" th:field="*{data}" />

                    <label class="form-label">Valor</label>
                    <input type="text" class="form-control" th:field="*{valor}" />
                    <br />

                    <button type="submit" class="btn btn-primary">
                        Realizar operação
                    </button>
                    <a class="btn btn-secondary" th:href="@{/home}">Cancelar</a>
                </form>

            </div>

        </div>
    </div>

</div>

<br>

</body>
</html>
