<!DOCTYPE html>
<html lang="pt_BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contas Cadastradas</title>
    <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css}" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fugaz+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="icon" th:href="@{/imagens/favicon.ico}" type="image/x-icon" />
</head>
<body>
     <!-- Cabecalho -->
    <div th:insert="~{cabecalho}"></div>
    
    <div class="container">
        <div class="card">
            <div class="card-header"> Contas Cadastradas</div>
            <div class="card-body">
                <div th:if ="${not #strings.isEmpty(mensagem)}" th:text="${mensagem}" class="alert alert-success"></div>
                <form th:action="@{/contas/form}" method="GET">
                    <button class="btn btn-primary" type="submit">Nova</button>
                </form>
                <br/>
                 <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>Número</th>
                            <th>Correntista</th>
                            <th>Data abertura</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="conta : ${contas}">
                            <td><a th:href="@{/contas/{id}(id=${conta.id})}" th:text="${conta.numero}"></a></td>
                            <td><a th:text="${conta.correntista.nome}"></a></td>
                            <td th:text="${conta.dataFormatada}"></td>
                            <td>
                                <a th:href="@{/contas/{id}/edit(id=${conta.id})}" class="btn btn-sm btn-outline-primary">Editar</a>
                                <a th:href="@{/contas/{id}/delete(id=${conta.id})}" class="btn btn-sm btn-outline-danger">Delete</a>
                            </td>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <br>
</body>
</html>
