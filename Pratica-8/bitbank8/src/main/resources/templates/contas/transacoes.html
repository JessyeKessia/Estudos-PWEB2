<!doctype html>
<html lang="pt_BR" xmlns:th="www.thymeleaf.org">
    <head>
        <title>BitBank - Cadastro de Transações</title>
         <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css}" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" th:href="@{/css/style.css}" />
        <link rel="icon" th:href="@{/imagens/favicon.ico}" type="image/x-icon" />
    </head>
<body>
     <!-- Cabecalho comum -->
    <div th:insert="~{cabecalho}"></div>
    <div class="container">

    <div class="card">

        <div class="card-header">
            Transações da Conta
        </div>

        <div class="card-body">

            <!-- Dados da conta -->
            <table class="table table-striped table-hover">
                <tr>
                    <th>Conta</th>
                    <th>Correntista</th>
                    <th>Data de abertura</th>
                </tr>
                <tr>
                    <td th:text="${conta.numero}"></td>
                    <td th:text="${conta.correntista.nome}"></td>
                    <td th:text="${#temporals.format(conta.data, 'dd/MM/yyyy')}"></td>
                </tr>
            </table>

            <!-- Lista de transações -->
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>Descrição</th>
                        <th>Data</th>
                        <th class="text-end">Valor</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="transacao : ${conta.transacoes}">
                        <td th:text="${transacao.descricao}"></td>
                        <td th:text="${#temporals.format(transacao.data, 'dd/MM/yyyy')}"></td>
                        <td th:text="${#numbers.formatCurrency(transacao.valor)}"></td>
                    </tr>
                </tbody>

            </table>

        </div>
    </div>
</div>

<br>

</body>
</html>
