<!doctype html>
<html lang="pt_BR" xmlns:th="www.thymeleaf.org">

<head>
    <title>BitBank - Cadastro de Conta</title>
    <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css}" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fugaz+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="icon" th:href="@{/imagens/favicon.ico}" type="image/x-icon" />
</head>

<body>
    <!-- Logo -->
    <div class="logo-bar mb-0 p-3">
        <span class="logo-font">
            <img th:src="@{/imagens/bitbank-header-t.png}"/> 
            BitBank
        </span>
    </div>
    <nav class="navbar navbar-expand navbar-light bg-light d-flex justify-content-between mb-3">
        <div class="navbar-nav">
            <a class="nav-item nav-link" th:href="@{/home}">Home</a>
            <a class="nav-irem nav-link" th:href="@{/correntistas}">Correntistas</a>
            <a class="nav-item nav-link" th:href="@{/contas}">Contas</a>
            <a class="nav-item nav-link" th:href="@{/contas/nuconta}">Operações</a>
        </div>
        <div style="margin-right: 5px;"> <a href="#">
            <button class="btn btn-outline-secondary my-2 my-sm-0">Sair</button></a>
        </div>
    </nav>

    <div class="container">
        <div th:if="${mensagem ne null}" th:text="${mensagem}" class="alert alert-success"></div>
        <div class="card">
            <div class="card-header">
                Cadastro de Conta
            </div>
            <div class="card-body">
                <form th:action="@{/contas}" method="POST" th:object="${conta}">
                    
                    <input type="hidden" th:field="*{id}" />

                    <label class="form-label" for="correntista">Número</label>
                    <input type="text" class="form-control" th:field="*{numero}" />

                    <label class="form-label" for="correntista">Correntista</label>
                    <select  class="form-select" th:field="*{correntista.id}">
                        <option th:each="cor : ${correntistaItems}" th:value="${cor.id}" th:label="${cor.nome}" /></option>
                    </select>
                    
                    <label class="form-label" for="lastName">Data</label> 
                    <input type="text" class="form-control" th:field="*{data}" /><br /><br />

                    <button class="btn btn-primary" value="salvar" type="submit">Salvar</button>
                    <a class="btn btn-secondary" th:href="@{/contas}">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
