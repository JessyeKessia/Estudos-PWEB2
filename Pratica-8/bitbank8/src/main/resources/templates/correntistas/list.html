<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css}" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="icon" th:href="@{/imagens/favicon.ico}" type="image/x-icon" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fugaz+One&display=swap" rel="stylesheet">
    <title>Cadastro de Correntistas</title>
  </head>
  <body>
    <!-- Cabecalho -->
    <div th:insert="~{cabecalho}"></div>

    <div class="container">
        <div class="card">
          <div class="card-header"> Cadastro de Correntista</div>
          <div class="card-body">
            <div th:if="${not #strings.isEmpty(mensagem)}" th:text="${mensagem}" class="alert alert-success"></div>

            <form th:action="@{/correntistas/form}" method="GET">
                <button class="btn btn-primary" type="submit">Nova</button>
            </form>
            <br/>

            <table class="table table-striped table-hover">
              <thead>
                <tr>
                  <th>Id</th>
                  <th>Nome</th>
                  <th>Email</th>
                  <th>Admin</th>
                  <th>Senha</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="correntista : ${correntistas}">
                  <td>[[${correntista.id}]]</td>
                  <td th:href="@{/correntistas/{id}(id=${correntista.id})}" th:text="${correntista.nome}"></a></td>
                  <td>[[${correntista.email}]]</td>
                  <td th:if="${correntista.admin}"> <img th:src="@{/imagens/admin.png}"></td>
                  <td th:unless="${correntista.admin}"><img th:src="@{/imagens/naoadmin.png}"></td>
                  <!--
                  <td>
                      <img th:src="${correntista.admin} ? @{/imagens/admin.png} : @{/imagens/naoadmin.png}">
                  </td>
                  -->
                  <td th:text="${#strings.substring(correntista.senha,0,3)} + '...'"></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
    </div>
  </body>
</html>
