<html xmlns:th="www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Correntistas</title>
    <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css}" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fugaz+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="icon" th:href="@{/imagens/favicon.ico}" type="image/x-icon" />

</head>
<body>
    <div class="logo-bar mb-0 p-3">
        <span class="logo-font">
            <img th:src="@{/imagens/bitbank-header-t.png}"/> 
            BitBank
        </span>
    </div>
    <nav class="navbar navbar-expand navbar-light bg-light d-flex justify-content-between mb-3">
        <div class="navbar-nav">
            <a class="nav-item nav-link" th:href="@{/home}">Home</a>
            <a class="nav-irem nav-link" th:href="@{/correntistas}">Correntistas</a>
            <a class="nav-item nav-link" th:href="@{/contas}">Contas</a>
            <a class="nav-item nav-link" th:href="@{/contas/nuconta}">Operações</a>
        </div>
        <div style="margin-right: 5px;"> <a href="#">
            <button class="btn btn-outline-secondary my-2 my-sm-0">Sair</button></a>
        </div>
    </nav>
    <div class="container">
        <div th:if="${mensagem ne null}" th:text="${mensagem}" class="alert alert-success"></div>
        <div class="card">
            <div class="card-header">
                Cadastro de Correntista
            </div>
            <div class="card-body">
                <form th:action="@{/correntistas}" method="POST" th:object="${correntista}">
                    
                    <input type="hidden" th:field="*{id}" />

                    <label for="nome" class="form-label">Nome:</label>
                    <input type="text" class="form-control" th:field="*{nome}" />

                    <label for="senha" class="form-label">Senha:</label>
                    <input type="password" class="form-control" th:field="*{senha}" />

                    <label for="email" class="form-label">Email:</label>
                    <input type="text" class="form-control" th:field="*{email}" /><br/>

                    <div class="form-check">
                        <label class="form-check-label"for="admin">Administrador</label>
                        <input type="checkbox" class="form-check-input" th:field="*{admin}" />
                    </div><br/>
                        <input type="submit" class="btn btn-primary" value="Salvar" />
                        <a class="btn btn-secondary" th:href="@{/correntistas}">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
