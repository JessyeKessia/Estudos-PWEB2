<div>
  <!-- Logo/Header -->
  <div class="logo-bar mb-0 p-3">
    <span class="logo-font">
      <img th:src="@{/imagens/bitbank-header-t.png}" />
      BitBank
    </span>
  </div>

  <!-- Menu de Navegação -->
  <nav class="navbar navbar-expand navbar-light bg-light d-flex justify-content-between mb-3">
    <div class="navbar-nav">
      <a class="nav-item nav-link" th:classappend="${menu == 'home'} ? 'active'" th:href="@{/home}">Home</a>

      <a class="nav-item nav-link" th:classappend="${menu == 'correntistas'} ? 'active'" th:href="@{/correntistas}" th:if="${session.usuario != null and session.usuario.admin}"> Correntistas </a>

      <a class="nav-item nav-link" th:classappend="${menu == 'contas'} ? 'active'" th:href="@{/contas}" th:if="${session.usuario != null and session.usuario.admin}">Contas</a>
      
      <a class="nav-item nav-link" th:classappend="${menu == 'operacoes'} ? 'active'" th:href="@{/contas/nuconta}">Operações</a>
    </div>
    <form class="form-inline my-2 my-lg-0" th:action="@{/auth/logout}" method="POST">
      <span sec:authorize="isAuthenticated()" sec:authentication="name" style="margin-right: 3x; font-size: 0.8em;"></span>
      <button type="submit" class="btn btn-outline-success my-2 my-sm-0">
        Sair
      </button>
    </form>
  </nav>
</div>
