<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/principal}" th:with="titulo='Cadastro de correntistas'">
  <head></head>  
<body>
    <!-- Cabecalho -->
     <div layout:fragment="conteudo">
       <form th:action="@{/correntistas/form}" method="GET">
          <button class="btn btn-primary" type="submit">Nova</button>
        </form>
        <br/>

        <div th:if="${not #lists.isEmpty(correntistas)}">
          <p th:text="'Total ' + ${#lists.size(correntistas)} + ' registros' "></p>
          <table class="table table-striped table-hover">
            <thead>
              <tr>
                <th>Id</th>
                <th>Nome</th>
                <th>Email</th>
                <th>Admin</th>
                <th>Usuário</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="correntista : ${correntistas}">
                <td>[[${correntista.id}]]</td>
                <td th:href="@{/correntistas/{id}(id=${correntista.id})}" th:text="${correntista.nome}"></a></td>
                <td>[[${correntista.email}]]</td>
                <td th:if="${correntista.admin}"> <img th:src="@{/imagens/admin.png}"></td>
                <td th:unless="${correntista.admin}"><img th:src="@{/imagens/naoadmin.png}"></td>
                <!--
                <td>
                    <img th:src="${correntista.admin} ? @{/imagens/admin.png} : @{/imagens/naoadmin.png}">
                </td>
                -->
                <td class="text-center" th:text="${correntista.user != null ? correntista.user.username : 'Sem usuário'}"></td>
              </tr>
            </tbody>
          </table>
      </div>
     </div>
  </body>
</html>
