<!DOCTYPE html>
<html lang="pt_BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta th:insert="~{/fragments/head(titulo='Contas Cadastradas')}">
</head>
<body>
     <!-- Cabecalho -->
    <div th:replace="~{/fragments/cabecalho}"></div>
    
    <div class="container">
        <div class="card">
            <div class="card-header"> Contas Cadastradas</div>
            <div class="card-body">
                <div th:if ="${not #strings.isEmpty(mensagem)}" th:text="${mensagem}" class="alert alert-success"></div>
                <form th:action="@{/contas/form}" method="GET">
                    <button class="btn btn-primary" type="submit">Nova</button>
                </form>
                <br/>
                 <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>Número</th>
                            <th>Correntista</th>
                            <th>Data abertura</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="conta : ${contas}">
                            <td><a th:href="@{/contas/{id}(id=${conta.id})}" th:text="${conta.numero}"></a></td>
                            <td><a th:text="${conta.correntista.nome}"></a></td>
                            <td th:text="${conta.dataFormatada}"></td>
                            <td>
                                <a th:href="@{/contas/{id}/edit(id=${conta.id})}" class="btn btn-sm btn-outline-primary">Editar</a>
                                <a th:href="@{/contas/{id}/delete(id=${conta.id})}" class="btn btn-sm btn-outline-danger">Delete</a>
                            </td>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <br>
</body>
</html>
